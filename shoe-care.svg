  <path d="M70 190 C100 190 120 180 150 170 C180 160 210 130 240 130 C260 130 270 145 270 160 C270 180 290 190 320 190 L320 215 C240 220 120 220 70 215 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <!-- Midsole detail -->
