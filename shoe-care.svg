  <text x="260" y="125" font-family="sans-serif" font-weight="900" font-size="9" fill="#0f172a" text-anchor="middle">BUYOERA</text>
  <text x="260" y="140" font-family="sans-serif" font-weight="700" font-size="7" fill="#2563eb" text-anchor="middle">SNEAKER</text>
  <text x="260" y="152" font-family="sans-serif" font-weight="600" font-size="6" fill="#64748b" text-anchor="middle">PRO FOAM</text>
  <!-- Sparkles -->
  <polygon points="120,110 125,125 140,130 125,135 120,150 115,135 100,130 115,125" fill="#f59e0b"/>
  <polygon points="170,80 173,90 183,93 173,96 170,106 167,96 157,93 167,90" fill="#3b82f6"/>
