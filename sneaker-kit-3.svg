<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)"/>
  
  <text x="300" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle">ODOR DEFENSE &amp; LINT-FREE POLISH</text>
  <text x="300" y="85" font-family="sans-serif" font-weight="600" font-size="12" fill="#0284c7" text-anchor="middle">50ml Anti-Bacterial Deodorizer + Ultra-Plush Microfiber Cloth</text>

  <!-- Microfiber Cloth Expanded -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="280" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3"/>
    <!-- Textured weave pattern -->
    <path d="M0 30 H220 M0 60 H220 M0 90 H220 M0 120 H220 M0 150 H220 M0 180 H220 M0 210 H220 M0 240 H220" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <text x="110" y="140" font-family="sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">HIGH-DENSITY</text>
    <text x="110" y="160" font-family="sans-serif" font-weight="700" font-size="11" fill="#93c5fd" text-anchor="middle">MICROFIBER WEAVE</text>
    <text x="110" y="185" font-family="sans-serif" font-weight="500" font-size="9" fill="#bfdbfe" text-anchor="middle">Zero Scratching • Ultra Absorbent</text>
  </g>

  <!-- Deodorizer Spray Bottle Standing -->
  <g transform="translate(360, 160)">
    <!-- Mist droplets -->
    <circle cx="80" cy="40" r="4" fill="#38bdf8"/>
    <circle cx="95" cy="25" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="38" r="5" fill="#38bdf8"/>
    <circle cx="125" cy="20" r="3.5" fill="#38bdf8"/>
    <!-- Bottle -->
    <rect x="40" y="110" width="80" height="200" rx="18" fill="#0284c7"/>
    <!-- Nozzle -->
    <rect x="68" y="75" width="24" height="35" rx="4" fill="#f8fafc"/>
    <path d="M68 75 C68 60 90 55 110 65" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Bottle Label -->
    <rect x="48" y="140" width="64" height="130" rx="6" fill="#ffffff"/>
    <text x="80" y="165" font-family="sans-serif" font-weight="900" font-size="9" fill="#0f172a" text-anchor="middle">BUYOERA</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="8" fill="#0284c7" text-anchor="middle">SNEAKER</text>
    <text x="80" y="198" font-family="sans-serif" font-weight="800" font-size="8" fill="#0f172a" text-anchor="middle">FRESH</text>
    <text x="80" y="215" font-family="sans-serif" font-weight="600" font-size="7" fill="#64748b" text-anchor="middle">50ml SPRAY</text>
    <circle cx="80" cy="245" r="12" fill="#ecfdf5"/>
    <text x="80" y="249" font-family="sans-serif" font-weight="800" font-size="9" fill="#10b981" text-anchor="middle">24H</text>
  </g>

  <!-- Value Feature Strip -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="400" height="50" rx="10" fill="#0f172a"/>
    <text x="200" y="30" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">
      ELIMINATES 99.9% OF SNEAKER ODORS • NATURAL EXTRACTS
    </text>
  </g>
</svg>
