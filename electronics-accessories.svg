<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="eaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#eaBg)"/>
  <!-- Ambient glow -->
  <circle cx="200" cy="150" r="100" fill="#cbd5e1" opacity="0.6"/>
  <!-- Desk line -->
  <path d="M40 210 L360 210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Cable Clip Base -->
  <rect x="120" y="180" width="160" height="30" rx="10" fill="url(#clipGrad)"/>
  <!-- Cable Slots -->
  <rect x="140" y="170" width="14" height="25" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="170" y="170" width="14" height="25" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="200" y="170" width="14" height="25" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="230" y="170" width="14" height="25" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <!-- Routed Cables with vibrant colors -->
  <path d="M147 80 C147 130 147 170 147 240" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <path d="M177 95 C177 140 177 170 177 240" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M207 70 C207 130 207 170 207 240" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <path d="M237 90 C237 135 237 170 237 240" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <!-- 3M Badge overlay -->
  <rect x="270" y="85" width="70" height="32" rx="6" fill="#dc2626"/>
  <text x="305" y="106" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">3M</text>
  <text x="305" y="128" font-family="sans-serif" font-weight="700" font-size="7" fill="#dc2626" text-anchor="middle">STRONG BOND</text>
</svg>
