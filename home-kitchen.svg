<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="hkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="turntableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#hkBg)"/>
  <!-- Turntable Base (Isometric/3D perspective) -->
  <ellipse cx="200" cy="210" rx="140" ry="45" fill="#cbd5e1"/>
  <ellipse cx="200" cy="205" rx="140" ry="45" fill="url(#turntableGrad)" stroke="#0f172a" stroke-width="3"/>
  <ellipse cx="200" cy="205" rx="125" ry="38" fill="#1e3a8a" opacity="0.12"/>
  <ellipse cx="200" cy="205" rx="115" ry="34" fill="#0f172a" opacity="0.08"/>
  <!-- Raised border -->
  <path d="M60 205 Q200 245 340 205 L340 190 Q200 230 60 190 Z" fill="#0f2445" opacity="0.9"/>
  <!-- Jars on Turntable -->
  <!-- Jar 1 (Olive Oil bottle) -->
  <rect x="185" y="80" width="30" height="85" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <rect x="193" y="65" width="14" height="15" fill="#ca8a04"/>
  <!-- Jar 2 (Spice container) -->
  <rect x="130" y="115" width="36" height="55" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <rect x="135" y="105" width="26" height="10" fill="#991b1b"/>
  <!-- Jar 3 (Condiment bottle) -->
  <rect x="235" y="110" width="35" height="60" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <rect x="240" y="100" width="25" height="10" fill="#c2410c"/>
  <!-- 360 Rotation Arrow Indicator -->
  <path d="M120 235 A100 25 0 0 0 280 235" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="6,4"/>
  <polygon points="285,233 275,225 278,238" fill="#2563eb"/>
  <rect x="160" y="245" width="80" height="22" rx="11" fill="#1e3a8a"/>
  <text x="200" y="260" font-family="sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">360° SPIN</text>
</svg>
