<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#0f2445"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowCircle" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Deep Navy Luxury Background -->
  <rect width="1200" height="600" fill="url(#heroGradient)"/>
  <rect width="1200" height="600" fill="url(#glowCircle)"/>

  <!-- Subtle Modern Mesh Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="550" y1="0" x2="550" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="850" y1="0" x2="850" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Left Side: Editorial Typography & Brand Badges -->
  <g transform="translate(80, 110)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="18" cy="17" r="4" fill="#fbbf24"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="1">CURATED ESSENTIALS 2026</text>

    <!-- Main Headline -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-0.5">
      Shop Smart.
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="url(#accentGold)" letter-spacing="-0.5">
      Live Better.
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      Discover high-utility, problem-solving lifestyle innovations.
    </text>
    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      Delivered express to your doorstep across 19,000+ Indian PIN codes.
    </text>

    <!-- CTA Badges Preview -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="180" height="52" rx="26" fill="#ffffff"/>
      <text x="90" y="32" font-family="sans-serif" font-weight="800" font-size="14" fill="#0a192f" text-anchor="middle">SHOP NOW →</text>

      <rect x="200" y="0" width="180" height="52" rx="26" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="290" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">EXPLORE TRENDING</text>
    </g>

    <!-- Trust Stats Row -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff">₹499</text>
      <text x="0" y="18" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Free Shipping Min.</text>

      <text x="140" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff">24-48h</text>
      <text x="140" y="18" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Express Dispatch</text>

      <text x="280" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff">100%</text>
      <text x="280" y="18" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">COD Available</text>
    </g>
  </g>

  <!-- Right Side: 3 Floating Product Isometric Cards -->
  <!-- Card 1: Sneaker Kit Card -->
  <g filter="url(#heroShadow)" transform="translate(680, 80)">
    <rect x="0" y="0" width="220" height="230" rx="20" fill="#ffffff"/>
    <rect x="15" y="15" width="190" height="130" rx="12" fill="#eff6ff"/>
    <text x="110" y="85" font-family="sans-serif" font-weight="900" font-size="34" fill="#2563eb" text-anchor="middle">👟</text>
    <text x="20" y="170" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">Sneaker Care Pro Kit</text>
    <text x="20" y="190" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b">Shoe Care</text>
    <text x="20" y="212" font-family="sans-serif" font-weight="900" font-size="15" fill="#0a192f">₹699</text>
    <text x="70" y="212" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-decoration="line-through">₹1,499</text>
    <rect x="135" y="196" width="65" height="20" rx="10" fill="#fef3c7"/>
    <text x="167" y="210" font-family="sans-serif" font-weight="800" font-size="9" fill="#b45309" text-anchor="middle">53% OFF</text>
  </g>

  <!-- Card 2: Wire Clips Card -->
  <g filter="url(#heroShadow)" transform="translate(930, 180)">
    <rect x="0" y="0" width="210" height="230" rx="20" fill="#ffffff"/>
    <rect x="15" y="15" width="180" height="130" rx="12" fill="#f8fafc"/>
    <text x="105" y="85" font-family="sans-serif" font-weight="900" font-size="34" fill="#1e293b" text-anchor="middle">🔌</text>
    <text x="20" y="170" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">Wire Clips (Pack 20)</text>
    <text x="20" y="190" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b">Electronics</text>
    <text x="20" y="212" font-family="sans-serif" font-weight="900" font-size="15" fill="#0a192f">₹349</text>
    <text x="70" y="212" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-decoration="line-through">₹799</text>
    <rect x="130" y="196" width="60" height="20" rx="10" fill="#fef3c7"/>
    <text x="160" y="210" font-family="sans-serif" font-weight="800" font-size="9" fill="#b45309" text-anchor="middle">56% OFF</text>
  </g>

  <!-- Card 3: Kitchen Organizer Card (Bottom Left Offset) -->
  <g filter="url(#heroShadow)" transform="translate(730, 330)">
    <rect x="0" y="0" width="230" height="210" rx="20" fill="#ffffff"/>
    <rect x="15" y="15" width="200" height="110" rx="12" fill="#ecfdf5"/>
    <text x="115" y="75" font-family="sans-serif" font-weight="900" font-size="34" fill="#059669" text-anchor="middle">🔄</text>
    <text x="20" y="150" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">360° Rotating Turntable</text>
    <text x="20" y="170" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b">Home &amp; Kitchen</text>
    <text x="20" y="192" font-family="sans-serif" font-weight="900" font-size="15" fill="#0a192f">₹899</text>
    <text x="70" y="192" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-decoration="line-through">₹1,999</text>
    <rect x="145" y="176" width="65" height="20" rx="10" fill="#fef3c7"/>
    <text x="177" y="190" font-family="sans-serif" font-weight="800" font-size="9" fill="#b45309" text-anchor="middle">55% OFF</text>
  </g>
</svg>
