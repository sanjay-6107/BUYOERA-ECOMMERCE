<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="koBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="koShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#koBg)"/>

  <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#0f172a" text-anchor="middle">BUYOERA 360° ROTATING ORGANIZER</text>
  <text x="300" y="80" font-family="sans-serif" font-weight="700" font-size="12" fill="#2563eb" text-anchor="middle">LAZY SUSAN SPICE TURNTABLE WITH NON-SLIP BASE</text>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="460" rx="220" ry="45" fill="#0f172a" opacity="0.08"/>

  <!-- Turntable Isometric Assembly -->
  <g filter="url(#koShadow)" transform="translate(100, 180)">
    <!-- Base Turntable Rim (Navy Blue Accent) -->
    <ellipse cx="200" cy="200" rx="190" ry="60" fill="#0a192f"/>
    <!-- Turntable Surface -->
    <ellipse cx="200" cy="190" rx="190" ry="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Anti-Slip Inner Grey/Navy Pad -->
    <ellipse cx="200" cy="190" rx="170" ry="50" fill="#1e293b" opacity="0.08"/>
    <!-- Raised Outer Guard Wall (Stops jars from tipping) -->
    <path d="M10 190 Q200 255 390 190 L390 160 Q200 225 10 160 Z" fill="#0f2445"/>
    <ellipse cx="200" cy="160" rx="190" ry="60" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- Jars Standing on Organizer -->
    <!-- Jar 1: Extra Virgin Olive Oil Bottle (Center Left) -->
    <g transform="translate(100, 30)">
      <rect x="0" y="30" width="45" height="130" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <rect x="12" y="5" width="20" height="25" fill="#ca8a04"/>
      <rect x="6" y="60" width="33" height="60" rx="4" fill="#ffffff"/>
      <text x="22" y="85" font-family="sans-serif" font-weight="800" font-size="8" fill="#854d0e" text-anchor="middle">OLIVE</text>
      <text x="22" y="98" font-family="sans-serif" font-weight="700" font-size="7" fill="#854d0e" text-anchor="middle">OIL</text>
    </g>

    <!-- Jar 2: Glass Paprika Spice Jar (Center) -->
    <g transform="translate(175, 50)">
      <rect x="0" y="20" width="50" height="100" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
      <rect x="8" y="5" width="34" height="15" rx="3" fill="#991b1b"/>
      <rect x="7" y="45" width="36" height="45" rx="4" fill="#ffffff"/>
      <text x="25" y="68" font-family="sans-serif" font-weight="800" font-size="8" fill="#991b1b" text-anchor="middle">CHILLI</text>
      <text x="25" y="80" font-family="sans-serif" font-weight="700" font-size="7" fill="#991b1b" text-anchor="middle">FLAKES</text>
    </g>

    <!-- Jar 3: Glass Turmeric Spice Jar (Center Right) -->
    <g transform="translate(255, 45)">
      <rect x="0" y="20" width="48" height="105" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
      <rect x="8" y="5" width="32" height="15" rx="3" fill="#a16207"/>
      <rect x="6" y="45" width="36" height="45" rx="4" fill="#ffffff"/>
      <text x="24" y="68" font-family="sans-serif" font-weight="800" font-size="8" fill="#a16207" text-anchor="middle">TURMERIC</text>
    </g>

    <!-- Jar 4: Himalayan Pink Salt Grinder (Right) -->
    <g transform="translate(325, 70)">
      <rect x="0" y="20" width="42" height="90" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
      <rect x="6" y="5" width="30" height="15" rx="3" fill="#831843"/>
      <text x="21" y="65" font-family="sans-serif" font-weight="800" font-size="7" fill="#9d174d" text-anchor="middle">SALT</text>
    </g>

    <!-- 360 Spin Dynamic Motion Arc -->
    <path d="M50 215 A160 45 0 0 0 350 215" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-dasharray="10,6"/>
    <polygon points="355,212 340,200 345,220" fill="#2563eb"/>
    <rect x="140" y="225" width="120" height="28" rx="14" fill="#1e3a8a"/>
    <text x="200" y="244" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">360° SMOOTH GLIDE</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="65" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b" text-anchor="middle">✓ BPA-Free ABS</text>
    
    <rect x="155" y="0" width="130" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="220" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b" text-anchor="middle">✓ Dual Bearings</text>

    <rect x="310" y="0" width="130" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="375" y="23" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b" text-anchor="middle">✓ 8kg Max Capacity</text>
  </g>
</svg>
