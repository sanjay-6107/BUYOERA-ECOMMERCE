<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="kitBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#prodBg)"/>
  
  <!-- Presentation Shadow Floor -->
  <ellipse cx="300" cy="510" rx="230" ry="30" fill="#0f172a" opacity="0.08"/>

  <!-- Luxury Presentation Box -->
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="220" height="350" rx="16" fill="url(#kitBox)"/>
    <!-- Box Trim & Foil Branding -->
    <rect x="85" y="135" width="190" height="320" rx="10" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="180" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">BUYOERA</text>
    <text x="180" y="235" font-family="sans-serif" font-weight="700" font-size="11" fill="url(#goldAcc)" text-anchor="middle" letter-spacing="3">SNEAKER CARE PRO</text>
    <text x="180" y="280" font-family="sans-serif" font-weight="500" font-size="10" fill="#94a3b8" text-anchor="middle">COMPLETE 4-IN-1 RESTORATION</text>
    <circle cx="180" cy="350" r="32" fill="#ffffff" fill-opacity="0.1"/>
    <polygon points="180,332 186,346 200,346 188,354 193,368 180,359 167,368 172,354 160,346 174,346" fill="url(#goldAcc)"/>
  </g>

  <!-- 150ml Foam Pump Bottle (Center Foreground) -->
  <g filter="url(#shadow)" transform="translate(230, 160)">
    <!-- Bottle Body -->
    <rect x="0" y="80" width="105" height="230" rx="20" fill="#0f172a"/>
    <!-- Label -->
    <rect x="8" y="115" width="89" height="150" rx="8" fill="#ffffff"/>
    <text x="52" y="145" font-family="sans-serif" font-weight="900" font-size="14" fill="#0a192f" text-anchor="middle">BUYOERA</text>
    <rect x="20" y="152" width="65" height="2" fill="#f59e0b"/>
    <text x="52" y="172" font-family="sans-serif" font-weight="800" font-size="10" fill="#2563eb" text-anchor="middle">DEEP FOAM</text>
    <text x="52" y="188" font-family="sans-serif" font-weight="600" font-size="8" fill="#64748b" text-anchor="middle">CLEANSER 150ml</text>
    <text x="52" y="225" font-family="sans-serif" font-weight="700" font-size="9" fill="#10b981" text-anchor="middle">100% ECO SAFE</text>
    <text x="52" y="242" font-family="sans-serif" font-weight="500" font-size="8" fill="#64748b" text-anchor="middle">CLEANS 50+ PAIRS</text>
    <!-- Cap & Pump Neck -->
    <rect x="25" y="45" width="55" height="35" rx="6" fill="#334155"/>
    <rect x="42" y="20" width="20" height="25" fill="#f59e0b"/>
    <path d="M42 20 C42 10 20 8 10 18" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Solid Beechwood Hog Bristle Brush (Right) -->
  <g filter="url(#shadow)" transform="translate(365, 250)">
    <!-- Wooden Handle -->
    <rect x="0" y="0" width="160" height="48" rx="14" fill="#b45309"/>
    <rect x="5" y="5" width="150" height="38" rx="10" fill="#d97706" opacity="0.6"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="800" font-size="11" fill="#78350f" text-anchor="middle" letter-spacing="1">BUYOERA</text>
    <!-- Bristles Layer -->
    <rect x="10" y="48" width="140" height="42" rx="4" fill="#451a03"/>
    <!-- Bristle Texture lines -->
    <path d="M20 48 v42 M30 48 v42 M40 48 v42 M50 48 v42 M60 48 v42 M70 48 v42 M80 48 v42 M90 48 v42 M100 48 v42 M110 48 v42 M120 48 v42 M130 48 v42" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Microfiber Cloth & Deodorizer Spray (Right Bottom) -->
  <g filter="url(#shadow)" transform="translate(365, 360)">
    <!-- Folded Microfiber Towel -->
    <rect x="0" y="20" width="150" height="85" rx="12" fill="#1e3a8a"/>
    <path d="M0 50 Q75 40 150 50" stroke="#3b82f6" stroke-width="3" fill="none"/>
    <text x="75" y="75" font-family="sans-serif" font-weight="700" font-size="10" fill="#93c5fd" text-anchor="middle">MICROFIBER TOWEL</text>
    <!-- Deodorizer Spray Bottle -->
    <rect x="110" y="-30" width="40" height="90" rx="8" fill="#0284c7"/>
    <rect x="122" y="-45" width="16" height="15" fill="#f8fafc"/>
    <text x="130" y="20" font-family="sans-serif" font-weight="800" font-size="7" fill="#ffffff" text-anchor="middle" transform="rotate(-90 130 20)">DEODORIZER</text>
  </g>

  <!-- Premium Quality Badge -->
  <g transform="translate(470, 60)">
    <circle cx="45" cy="45" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="45" y="38" font-family="sans-serif" font-weight="900" font-size="12" fill="#f59e0b" text-anchor="middle">ORIGINAL</text>
    <text x="45" y="52" font-family="sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">4-IN-1 KIT</text>
    <text x="45" y="65" font-family="sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle">PROFESSIONAL</text>
  </g>
</svg>
